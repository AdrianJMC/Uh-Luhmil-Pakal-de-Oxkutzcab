services:
  - type: web
    name: Uh-Luhmil-Pakal-de-Oxkutzcab
    # No 'env: php' aquí; Render usará el Dockerfile automáticamente.
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_URL
        value: https://uh-luhmil-pakal-de-oxkutzcab.onrender.com
      - key: FORCE_HTTPS
        value: true

    disks:
      - name: app-db
        mountPath: /var/www/html/database
        sizeGB: 1

      # 🔐 Define APP_KEY como Secret en el panel de Render
      # - key: APP_KEY
      #   value: base64:xxxx

      # 🗄️ SQLite dentro del contenedor Docker
      - key: DB_CONNECTION
        value: sqlite
      - key: DB_DATABASE
        value: /var/www/html/database/database.sqlite

      # 🧠 Sesiones en archivos (no DB)
      - key: SESSION_DRIVER
        value: file

      # (Opcional) Simplificar cache/colas
      # - key: CACHE_DRIVER
      #   value: file
      # - key: QUEUE_CONNECTION
      #   value: sync
